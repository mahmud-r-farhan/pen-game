name: luminapaper
description: "Lumina Paper: 4K Wallpapers, Video Live Wallpapers & Auto Screen Unlock Changer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  video_player: ^2.9.2
  file_picker: ^8.1.7
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  flutter_blurhash: ^0.8.2
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
