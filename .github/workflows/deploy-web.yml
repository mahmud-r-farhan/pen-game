name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'client_flutter/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
          cache-key: 'flutter-3.44.9-${{ runner.os }}'

      - name: Get Flutter dependencies
        working-directory: ./client_flutter
        run: flutter pub get

      - name: Build Web release
        working-directory: ./client_flutter
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
        run: |
          set -euo pipefail
          ARGS=(--release --base-href=/)
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && \
             [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_PROJECT_ID" ] && \
             [ -n "$FIREBASE_AUTH_DOMAIN" ]; then
            ARGS+=(
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID"
              --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
              --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
              --dart-define="FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            )
          else
            ARGS+=(--dart-define=FIREBASE_ENABLED=false)
          fi
          flutter build web "${ARGS[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./client_flutter/build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: 'github-pages'
