name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Server-side checks
  server-check:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server_deno
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check
        run: deno task check

      - name: Deno tests
        run: deno task test

  # Client-side checks
  client-check:
    name: Client Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/flutter-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/flutter-tests.log"
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'flutter-tests.log').read_text(errors='replace')
          # An annotation keeps the failure visible even when job logs are inaccessible.
          text = text[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Flutter test output::{text}')
          PYCODE
          fi
          exit "$status"
