name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    name: Server Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server_deno
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check
        run: deno task check

      - name: Deno tests (physics + content contract)
        run: deno task test

  client-check:
    name: Client Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./client_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
          cache-key: 'flutter-3.44.9-${{ runner.os }}'

      - name: Get dependencies
        run: flutter pub get

      # `flutter analyze` prints plain text, which is invisible unless you open
      # the raw log. Machine format lets us re-emit every issue as a GitHub
      # annotation so the error is readable from the checks UI and the API.
      # Errors and warnings are fatal (matching `flutter analyze`); infos are not.
      - name: Analyze code
        run: |
          set +e
          dart analyze --format=machine lib test > "$RUNNER_TEMP/analyze.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/analyze.txt"
          python3 - "$RUNNER_TEMP/analyze.txt" <<'PYCODE'
          import sys

          path = sys.argv[1]
          errors = warnings = 0
          try:
              lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
          except OSError as exc:
              print('::error title=Dart analyzer::could not read analyzer output: %s' % exc)
              sys.exit(1)

          for line in lines:
              if not line.strip():
                  continue
              parts = line.split('|')
              if len(parts) < 8:
                  print('::error title=Dart analyzer::' + line.replace('%', '%25'))
                  errors += 1
                  continue
              severity, _kind, _code, file, line_no, col, _length, message = parts[:8]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if severity == 'ERROR':
                  print(f'::error file={file},line={line_no},col={col},title=Dart analyzer::{message}')
                  errors += 1
              elif severity == 'WARNING':
                  print(f'::warning file={file},line={line_no},col={col},title=Dart analyzer::{message}')
                  warnings += 1
              else:
                  print(f'::notice file={file},line={line_no},col={col},title=Dart analyzer (info)::{message}')

          print(f'::notice title=Dart analyzer summary::errors={errors} warnings={warnings}')
          sys.exit(1 if (errors or warnings) else 0)
          PYCODE

      - name: Run tests
        run: flutter test --reporter expanded
